<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110">
  <defs>
    <!-- Gradiente sutil para dar um toque moderno ao verde -->
    <linearGradient id="tecGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B87C" />
      <stop offset="100%" stop-color="#008F61" />
    </linearGradient>
  </defs>

  <!-- Grupo do Ícone (Esquerda) -->
  <g transform="translate(15, 15)">
    <!-- Fundo arredondado do ícone -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#tecGreen)" />

    <!-- Letra "T" estilizada (estilo board/quadro) -->
    <path d="M 18 20 H 62 V 31 H 45.5 V 62 H 34.5 V 31 H 18 Z" fill="#FFFFFF" />

    <!-- Engrenagem (canto inferior direito do ícone) -->
    <g transform="translate(55, 55)">
      <!-- Recorte de fundo para separar a engrenagem do T -->
      <circle cx="0" cy="0" r="14" fill="#009665" />
      <!-- Dentes da engrenagem -->
      <path d="M -2.5 -12 L 2.5 -12 L 3.2 -9 A 9.5 9.5 0 0 1 6.2 -7.7 L 8.8 -9.3 L 11.8 -6.3 L 9.8 -3.8 A 9.5 9.5 0 0 1 10.8 -0.8 L 13.5 0 L 13.5 4 L 10.5 4.8 A 9.5 9.5 0 0 1 8.8 7.5 L 10.3 10.1 L 7.3 13.1 L 4.8 11.1 A 9.5 9.5 0 0 1 1.8 12.1 L 1 15 L -3 15 L -3.8 12.1 A 9.5 9.5 0 0 1 -6.8 11.1 L -9.3 13.1 L -12.3 10.1 L -10.8 7.5 A 9.5 9.5 0 0 1 -12.5 4.8 L -15.5 4 L -15.5 0 L -12.8 -0.8 A 9.5 9.5 0 0 1 -11.8 -3.8 L -13.8 -6.3 L -10.8 -9.3 L -8.2 -7.7 A 9.5 9.5 0 0 1 -5.2 -9 L -4.5 -12 Z" fill="#FFFFFF" transform="scale(0.85)" />
      <!-- Miolo da engrenagem -->
      <circle cx="0" cy="1.2" r="3.5" fill="#009665" />
    </g>
  </g>

  <!-- Texto "Tecboard" (Direita) -->
  <text x="112" y="69" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1" fill="#009E6B">
    Tecboard
  </text>
</svg>